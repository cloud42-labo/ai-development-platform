# ADP package manifest
#
# Machine-readable entry point for this repository as a versioned package.
# Not a package-manager config for a build tool — a plain, hand-maintained
# YAML file an adopting agent or script can parse to know what this
# repository currently is, what it depends on, and how it is versioned.
#
# See docs/versioning-policy.md for what changes MAJOR/MINOR/PATCH on each
# version field below, and for why Rules/Schemas/Workflows/Templates/Skills
# version independently rather than sharing one number.

package: ai-development-platform
description: >-
  ADP — the operating system for Cloud42 Labo's AI-native product
  development organization. System of record for durable operating
  models, governance, capability maps, architecture, and reusable
  templates.

# Overall package version. Fixed at 1.0.0 by ADP-049-H: the ADP-049 packaging
# chain (A: inventory, B: this manifest, C: package/ index, D: adp-bootstrap
# Skill install/configure, E: upgrade/migration, F1-F3: doctor, secret-scan,
# licensing, G: Clean Install E2E, H: this fix-point) is complete. A Clean
# Install E2E (preflight -> plan -> apply -> doctor -> idempotent re-run ->
# scan_secrets) passed into a genuinely fresh, isolated target repository —
# see the ADP-049 Notion Story's Result for the run's concrete evidence.
# Per-class versions (rules/schemas/workflows/templates/skills, above and
# below) stay independent of this field going forward, as designed.
version: 1.0.0

# Version of the Schemas asset class (currently: governance/agent-policy.yaml
# only). Kept separate from `version` because a schema/policy-format change
# can be breaking for an adopter even when no other asset changed.
# Pre-release because agent-policy.yaml is explicitly marked non-authoritative
# — see docs/v1-asset-inventory.md's "Freeze-scope exception".
schema_version: 0.1.0-experimental

# Version of the Rules asset class (README.md, AGENTS.md,
# governance/ai-execution-constraints.md, governance/source-of-truth.md,
# governance/research-security-policy.md,
# governance/authority-stop-gate-regression-cases.md,
# governance/state-transition-pre-check-regression-cases.md,
# docs/human-gate-pre-check-examples.md, docs/regulations/README.md and
# R01-R06).
rules_version: 3.3.0

# Version of the Workflows asset class (docs/operating-guide.md,
# governance/postmortem-improvement-loop.md,
# governance/monthly-risk-management-review.md,
# docs/product-design-doc-standard.md).
workflow_version: 1.1.0

# Version of the Templates asset class (templates/README.md,
# templates/monthly-risk-review.md, templates/product-vision.md,
# templates/inception-deck.md, templates/prd.md, templates/design-doc.md,
# templates/epic-brief.md).
templates_version: 0.2.0

# Version of the Skills asset class: the executable procedures that install,
# upgrade, validate and safety-check this package. Currently one Skill,
# `adp-bootstrap`, which is hosted in cloud42-labo/skills (see
# package/skills.md for the file-level index and `skills_source` below) and
# NOT in this repository.
#
# This is the first version this class has carried. docs/v1-asset-inventory.md
# (ADP-049-A) classified Skills as "not present in this repo" and deferred it
# as an explicit cross-repo dependency; docs/versioning-policy.md's rule is to
# "add fields for them when content first exists, not preemptively". Content
# now exists — ADP-049-D/E/F1/F2 built plan/apply/doctor/scan_secrets — so the
# field is added here rather than left implicit.
#
# Still 0.1.0: ADP-049-G's Clean Install E2E (2026-09-21) has now run this
# Skill's install/doctor/scan_secrets path against a genuinely fresh, isolated
# target and it passed — see this file's `version: 1.0.0` migration_path entry
# for the run's evidence. That validates the Skill's current content; it is
# not, by itself, a content change to the Skill (plan.py/apply.py/doctor.py/
# scan_secrets.py were not modified to pass it), so per
# docs/versioning-policy.md's Skills judgment (version by what changed for an
# adopter, not by validation milestones) this field does not bump on that
# basis alone. Two non-blocking gaps the E2E run surfaced — scan_secrets
# literals missing from SOURCE_VALUES, and apply.py's up_to_date path not
# repairing doctor-detected missing_files — are follow-up work tracked in
# that migration_path entry, not yet fixed here.
skills_version: 0.1.0

# Where the Skills asset class physically lives. Unlike the other four
# classes, this one is not resolvable by a path relative to this repository,
# so an adopter (or a doctor/plan run) needs the repository named explicitly.
#
# `ref` pins skills_version 0.1.0 to the exact commit that content was at
# when this field was added — the last commit under `path` before this
# manifest change (`git log --oneline -- .claude/skills/adp-bootstrap` in
# cloud42-labo/skills). `repository` + `path` alone point at a mutable
# branch: checking out this ADP commit later would silently resolve to
# whatever `cloud42-labo/skills#main` has become by then, while still
# reporting `skills_version: 0.1.0`. Bump `ref` in lockstep with every
# `skills_version` change; never leave it pointing past what that version
# number claims.
skills_source:
  repository: cloud42-labo/skills
  path: .claude/skills/adp-bootstrap
  ref: 9043914 # cloud42-labo/skills@9043914 — content matching skills_version 0.1.0
  index: package/skills.md

# What an adopting agent/environment must have to operate this package as
# intended. Not enforced by tooling here (no custom package manager) —
# documentary, for an adopter or a future Bootstrap Skill (ADP-049-D) to
# check against.
required_capabilities:
  - notion_stories_and_tasks_write   # Status/Started At/Completed At/Result on managed Tasks
  - notion_postmortems_write         # Postmortems DB, incl. Reviewer/Review Status/Review Notes (ADP-043-K)
  - github_pr_workflow               # branch, commit, push, create/update PR on allowed repositories
  - jst_time_source                  # governance timestamps are recorded in JST

# Adapters this package can optionally integrate with. None exist yet.
# docs/cloudflare-os-evaluation.md places a policy-enforcement adapter at
# Phase 2/3 — intentionally out of v1.0.0 scope, not a gap in this manifest.
optional_adapters: []

# Where an adopting agent/script finds the four asset classes above, and
# where this deployment's own environment-specific values (Notion workspace,
# GitHub org/repo names, named AI roles) are documented for manual reference.
# This is a catalogue an adopter reads, not a substitution mechanism — the
# canonical files under package_root's index still contain Cloud42's values
# as-is (see package/README.md's "Environment-specific values" for why, and
# for ADP-049-D, which is where actual compile-time substitution belongs).
# Added by ADP-049-C; see package/README.md for why package_root is a
# reference index rather than a physical file move.
package_root: package/README.md
example_config: examples/cloud42-labo-config.md

# How to move between manifest states. This is the first manifest this
# repository has had, so there is no prior version to migrate from — the
# only entry today documents adopting the manifest itself. Add an entry
# here whenever a future version bump requires an adopter to change
# something (see docs/versioning-policy.md's "when to add a migration_path
# entry").
migration_path:
  - from: null
    to: "0.1.0"
    date: "2026-08-29"
    change: >-
      Initial manifest. No prior versioned state existed; this entry
      documents that the manifest itself is new, not a behavior change
      to the underlying Rules/Workflows/Templates (those were classified,
      not modified, by ADP-049-A).
    action_required: none
  # ADP-049-C (2026-08-30) added the package_root/example_config fields
  # above without bumping any version field: both are new optional-to-use
  # fields, no existing field changed meaning, and no asset content
  # changed — per docs/versioning-policy.md's "When to add a
  # migration_path entry", a bump-free additive change does not need one.
  - field: rules_version
    from: "0.1.0"
    to: "0.2.0"
    date: "2026-08-30"
    change: >-
      ADP-046: governance/ai-execution-constraints.md's managed-work
      execution pre-flight and completion post-flight each gained a new
      step ("AI Work Session opened" / "AI Work Session closed") plus an
      "AI Work Session recording" subsection with the full field mapping.
      Additive (MINOR per docs/versioning-policy.md's Rules judgment): no
      existing gate, field, or required step was removed or redefined.
    action_required: >-
      An adopter following this Rule must, from this version on, also
      create/update a row in an AI Work Sessions-equivalent database at
      Task start and end (see governance/ai-execution-constraints.md's
      "AI Work Session recording"), not only the Task's own Status/Time
      Event. An adopter with no such database should either create one
      matching that section's fields, or explicitly adopt the section's
      degradation rule (record the gap in the Task's Result, do not block
      substantive work on it).
  - field: workflow_version
    from: "0.1.0"
    to: "0.2.0"
    date: "2026-08-30"
    change: >-
      ADP-050: added docs/product-design-doc-standard.md — the Vision /
      Inception Deck / PRD / Design Doc / Epic Brief flow, where each lives,
      and when each is synced. Additive: no existing Workflow document's
      required steps changed.
    action_required: >-
      None to adopt the field bump itself. Adopting the standard's content
      (creating the five documents for a Product, syncing PRD/Design Doc at
      Epic completion) is the separate, per-Product backfill work tracked
      as ADP-050's child Tasks — not implied by the version bump alone.
  - field: templates_version
    from: "0.1.0"
    to: "0.2.0"
    date: "2026-08-30"
    change: >-
      ADP-050: added templates/product-vision.md, inception-deck.md,
      prd.md, design-doc.md, epic-brief.md — the five templates for
      docs/product-design-doc-standard.md. Additive: no existing template
      changed.
    action_required: none
  - field: rules_version
    from: "0.2.0"
    to: "1.0.0"
    date: "2026-09-01"
    change: >-
      ADP-043-O (Postmortem PM-8): the Human gate pre-flight in
      governance/ai-execution-constraints.md gained a new step
      ("Current-gate relevance checked") between classifying a criterion
      Human-only and creating the Human Request for it. Added
      governance/state-transition-pre-check-regression-cases.md and
      Pattern 4 in docs/human-gate-pre-check-examples.md. MAJOR per
      docs/versioning-policy.md's Rules judgment (corrected after Codex
      review on ai-development-platform PR #19): the prior gate's own
      written form (old step 4/5, now renumbered 4/6/7) blocked/permitted
      a Human Request whenever ANY `Human-only` criterion remained,
      regardless of which transition it belonged to — the exact behavior
      that produced PM-8. The new step 5 makes that same
      previously-compliant behavior (creating a Human Request or Blocked
      state for a `Human-only` criterion that gates a *different*,
      downstream transition) non-compliant, and narrows the condition
      under which the existing gate fires. That is a loosening of a
      relied-upon safety gate per the policy's own MAJOR criteria, not a
      purely additive new constraint — even though its purpose is to
      prevent the gate from being *misapplied*, not to remove it from
      cases where it genuinely applies.
    action_required: >-
      An adopter following this Rule must, before setting a task/PR to a
      Human-reason Blocked state or reporting one as Human-waiting
      (including during a backlog sweep, not only when first creating the
      gate), name the exact transition being evaluated and confirm each
      remaining Human-only criterion is a mandatory prerequisite of that
      transition specifically — not of a later, independent transition in
      the same flow (deployment, publication, real-device/environment
      Acceptance) — before treating it as blocking. A criterion that only
      gates a downstream transition must not block the current one; route
      it as its own Human Request scoped to the transition it actually
      gates. Demoting an existing Human gate under this step still
      requires the same evidence standard as the rest of the Human gate
      pre-flight (see governance/state-transition-pre-check-regression-cases.md
      Case 2): a criterion an accountable reviewer has explicitly and
      currently tied to the transition being evaluated stays blocking
      until that same authority revises it — this step narrows AI-invented
      over-blocking, it does not let an agent unilaterally override an
      explicit, still-current reviewer decision.
  - field: workflow_version
    from: "0.2.0"
    to: "0.3.0"
    date: "2026-09-01"
    change: >-
      ADP-043-O (Postmortem PM-8): docs/operating-guide.md gained new
      section 11.8 "Current-gate relevance (state transition boundary)",
      and 11.6's standing re-evaluation gained a cross-reference to it.
      Additive: no existing Stage/Gate/step/closure criterion changed.
      Stays MINOR even though the paired rules_version entry above was
      corrected to MAJOR — this file is the descriptive policy source
      (Operating Guide), not the executable guardrail (Rules); it only
      gained a new described step, it did not itself narrow when an
      existing Workflow Stage/Gate/closure criterion applies.
    action_required: >-
      Same as the paired rules_version 1.0.0 entry above — this Workflow
      bump is the durable-destination half of the same behavior change;
      adopt both together.
  - field: workflow_version
    from: "0.3.0"
    to: "1.0.0"
    date: "2026-09-04"
    change: >-
      ADP-054-T10: docs/operating-guide.md's "Weekly Sprint operation"
      numbered list changed from Sprint Review -> Backlog Refinement ->
      Sprint Planning -> Execution -> Retrospective -> Update weekly focus
      to Sprint Review -> Retrospective -> Backlog Refinement -> Sprint
      Close -> Sprint Goal review -> Sprint Planning, matching the
      cloud42-labo/skills weekly-sprint Composite's already-approved order
      (ADP-054) and the order Notion's Job Schedule|AI自動実行スケジュール
      has actually run since. MAJOR per docs/versioning-policy.md's
      Workflow judgment (Codex-reported correction to an initial MINOR
      classification on this same PR): Execution and Update weekly focus
      are removed as named steps and Retrospective/Refinement are
      reordered relative to each other, regardless of whether the new
      order was already the de facto practice elsewhere -- this file
      versions what the durable artifact itself asserts, not whether
      reality had already moved past it.
    action_required: >-
      An adopter whose own Routine/Scheduler prompt, checklist, or tooling
      still names or numbers the old six steps (Review / Refinement /
      Planning / Execution / Retrospective / Update focus) must update it
      to the new order and step names (Review / Retrospective / Refinement
      / Close / Goal review / Planning) -- in particular, treating
      "Retrospective" as the step immediately after Review rather than
      near the end, and recognizing Sprint Close and Sprint Goal review as
      their own steps rather than folding them into Planning or Execution.
  - field: rules_version
    from: "1.0.0"
    to: "2.0.0"
    date: "2026-09-05"
    change: >-
      ADP-053: removed the "AI Work Session opened" / "AI Work Session
      closed" steps and the "AI Work Session recording" subsection from
      governance/ai-execution-constraints.md's managed-work execution
      pre-flight and completion post-flight (added by the rules_version
      0.2.0 entry above, ADP-046). The `AI Work Sessions` Notion database
      had stopped being populated since 2026-08-30 and duplicated
      information already carried by Stories & Tasks (`Result`, `Pull
      Request`), Task Time Events (elapsed-time measurement), and GitHub
      (PR/commit history). MAJOR per docs/versioning-policy.md's Rules
      judgment ("removes ... a gate an adopter may be relying on for
      safety"): agent behavior that was required to stay compliant under
      1.0.0 (opening/closing an `AI Work Sessions` row per Task) is no
      longer part of this file at all.
    action_required: >-
      An adopter who built compliance checks, dashboards, or tooling
      against the `AI Work Sessions` fields this Rule used to require
      (`Status = Running`/`Success`/`Failed`/`Needs Human`, `Started
      At`/`Completed At`, the `⚠ Session Missing Started At` / `⚠ Success
      Missing Completed At` views) should retire them: per-execution audit
      evidence now comes from the Task's own `Result`, `Pull Request`/Git
      commit identifiers, and Task Time Events only. Do not create a
      replacement session-log database or field to fill the gap — that is
      the packaged non-goal this bump encodes, not an oversight to correct
      locally. An adopter with an existing `AI Work Sessions`-equivalent
      database may keep its historical rows for audit purposes; this bump
      only removes the requirement to keep writing new ones.
  - field: rules_version
    from: "2.0.0"
    to: "3.0.0"
    date: "2026-09-05"
    change: >-
      ADP-056: reviewer availability failure no longer forces an indefinite
      stop when another independent reviewer exists; the exact reviewed SHA
      must equal the merge head; and review-loop cost is bounded by an
      Approach Refinement trigger at round 3 and a default hard cap at round
      5. MAJOR because this deliberately loosens the prior Codex-specific
      review gate while changing previously-compliant repeated-review
      behavior into a refinement requirement.
    action_required: >-
      Adopters must preserve Author != Reviewer, record fallback evidence,
      verify the exact reviewed SHA again immediately before merge, and must
      stop patch-by-patch review after three repeated same-area finding
      rounds. A sixth substantive automated review requires explicit Owner
      approval; otherwise return to Approach Refinement, split the PR, or
      redesign the change. Reviewer usage limits do not authorize paid
      capacity changes without Owner approval.
  - field: rules_version
    from: "3.0.0"
    to: "3.1.0"
    date: "2026-09-16"
    change: >-
      ADP-049-F3: README.md gained a "License / usage terms" section
      stating that no OSS license is currently granted (default copyright
      applies) and that installing or redistributing this package into
      another environment requires the repository owner's explicit
      permission until a license is formally adopted. MINOR per
      docs/versioning-policy.md's Rules judgment: this is a new,
      previously-undocumented constraint on redistribution, but it adds a
      permission requirement rather than invalidating any prior
      compliant behavior (installing/reading the package as adp-bootstrap
      already does was never itself redistribution to a third party).
    action_required: >-
      An adopter who intends to redistribute this package (or a fork of
      it) to another organization beyond their own installation must first
      confirm license/permission status with this repository's owner —
      adp-bootstrap's own dry-run/install/upgrade into an adopter's own
      environment is not itself redistribution and needs no such check.
  - field: rules_version
    from: "3.1.0"
    to: "3.2.0"
    date: "2026-09-19"
    change: >-
      ADP-049-F3-02: Cloud42 Labo's owner adopted the MIT License. A
      LICENSE file was added and README.md's "License / usage terms"
      section was rewritten from "no license — contact the owner for
      redistribution permission" to "MIT — reuse/redistribution permitted
      under the license's own terms". Classified MINOR per
      docs/versioning-policy.md's Rules judgment: this replaces the prior
      entry's owner-permission requirement with a standing grant, so no
      previously-compliant adopter (one who had already obtained the
      owner's permission, or one who had not yet redistributed at all)
      is made non-compliant by the change — it only removes a step
      (asking) that MIT no longer requires.
    action_required: >-
      An adopter who previously required the repository owner's explicit
      permission before reusing or redistributing this package no longer
      needs to ask — MIT's own terms (retain the copyright notice and
      license text; no warranty) now apply instead. No action is needed
      for an adopter who was only installing/reading the package for
      their own use, since that was never gated on this constraint.
  - field: skills_version
    from: null
    to: "0.1.0"
    date: "2026-09-18"
    change: >-
      ADP-049: added the Skills asset class (`skills_version`,
      `skills_source`, and the package/skills.md index) to this manifest.
      ADP-049-A classified Skills as "not present in this repo" and deferred
      it as an explicit cross-repo dependency; ADP-049-C then normalized only
      the four in-repo classes. Since then ADP-049-D/E/F1/F2 built the
      `adp-bootstrap` Skill (plan / apply / doctor / scan_secrets) in
      cloud42-labo/skills, so the class now has content and
      docs/versioning-policy.md's own rule ("add fields for them when content
      first exists") applies. Additive: no existing field changed meaning, no
      asset content changed, and no other version field is bumped by this
      entry. Notably this is not a MAJOR event for any other class — it
      records that a fifth class became versionable, not that an existing
      one changed.
    action_required: >-
      An adopter who previously installed this package by resolving only the
      four in-repo classes (Rules/Schemas/Workflows/Templates) now has a
      fifth component to account for: the `adp-bootstrap` Skill named by
      `skills_source`, which must be fetched from cloud42-labo/skills
      separately because it is not reachable by a path relative to this
      repository. Record its installed `skills_version` alongside the other
      four so a later upgrade can tell whether it drifted. Note the current
      tooling limitation: the adp-bootstrap scripts hardcode their own
      four-entry ASSET_CLASSES map, so a `skills_version` change is parsed
      but does NOT yet trigger change detection in plan.py/doctor.py —
      extending that map lives in cloud42-labo/skills and is tracked as
      follow-up, so until then, compare `skills_version` by hand at upgrade
      time rather than assuming doctor will flag it.
  - field: rules_version
    from: "3.2.0"
    to: "3.3.0"
    date: "2026-09-22"
    change: >-
      ADP-059-F: package/workflows.md's regulation-index entry
      (docs/regulations/README.md and R01-R06) was removed and
      package/rules.md now lists that index and each R01-R06 file
      individually. R01-R06 are binding constraints, not multi-step
      processes, so this corrects an asset-class misclassification; no
      R01-R06 content itself changed. MINOR per docs/versioning-policy.md's
      Rules judgment: this is new, previously-missing discoverability for
      already-binding content under the correct class, not a change to
      what compliance already required.
    action_required: >-
      An adopter who tracked the regulation index's location via
      workflow_version must retarget that tracking to rules_version —
      the index and R01-R06 no longer appear under Workflows at all.
  - field: workflow_version
    from: "1.0.0"
    to: "1.1.0"
    date: "2026-09-22"
    change: >-
      ADP-059-F: the paired workflow_version half of the rules_version
      3.3.0 entry above — package/workflows.md lost its (misclassified)
      regulation-index entry. No genuine Workflow document
      (postmortem-improvement-loop.md, monthly-risk-management-review.md,
      product-design-doc-standard.md) changed; bumped only so an adopter
      watching workflow_version for this repository sees a signal that
      the class's file list changed, matching the paired rules_version
      bump.
    action_required: >-
      Same as the paired rules_version 3.3.0 entry above — adopt both
      together.
  - field: version
    from: "0.1.0"
    to: "1.0.0"
    date: "2026-09-21"
    change: >-
      ADP-049-H: overall package version fixed at 1.0.0 as a coherent
      release, per this file's own `version` field comment and
      docs/versioning-policy.md's "Overall version" rule. This is not
      derived from any single per-class version bump; it marks that the
      ADP-049 packaging chain (manifest, package index, adp-bootstrap
      Skill install/upgrade/doctor/scan_secrets, Clean Install E2E) is
      now complete and verified end-to-end. ADP-049-G's Clean Install
      E2E ran preflight -> plan (dry-run) -> apply (dry-run, then real)
      -> doctor -> idempotent re-run (up_to_date, no file duplication)
      -> scan_secrets against a genuinely fresh, isolated target
      repository (no prior `.adp/installed.yaml`), using this commit as
      `--source-ref`. All steps produced their expected exit codes and
      output; see the ADP-049 Notion Story's Result for the transcript.
    action_required: >-
      None for an adopter already tracking per-class versions
      (rules_version/schema_version/workflow_version/templates_version/
      skills_version) individually — this bump changes only the overall
      `version` field, not any asset content. An adopter who has not yet
      run adp-bootstrap should now treat this repository plus the
      `adp-bootstrap` Skill (cloud42-labo/skills) as a verified-installable
      v1.0.0 package rather than a pre-release snapshot. Two known,
      non-blocking gaps carried forward from the Clean Install E2E run,
      to track as follow-up rather than re-litigate here: (1)
      `scan_secrets.py` flagged two Cloud42-specific repository literals
      (`cloud42-labo/store-survival-simulator` in
      docs/product-design-doc-standard.md,
      `cloud42-labo/serendipity-spot` in
      governance/state-transition-pre-check-regression-cases.md) that are
      not in `apply.py`'s `SOURCE_VALUES` substitution table — harmless
      for cloud42-labo's own re-install/upgrade, but would leak into a
      different organization's install verbatim; (2) `apply.py`'s
      `up_to_date` path does not re-render or repair a file that
      `doctor.py` reports as `missing_files` when the installed version
      already matches the source version (manually deleting a required
      file post-install left it missing after a same-version re-apply;
      only a version bump — or a manual copy — restores it). Neither gap
      blocked this Clean Install E2E (which exercises the `install`
      decision path, not drift-repair), but both are real limitations an
      adopter or maintainer should plan to close.
