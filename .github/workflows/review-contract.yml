name: Review Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review-contract:
    name: Review Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run parser regression tests
        working-directory: .github/scripts
        # Discover every test_*.py module, not just test_review_contract.py --
        # regressions have also landed in their own focused file (e.g.
        # test_review_contract_hidden_regions.py) and a single hardcoded
        # filename here would silently stop covering them in CI.
        run: python3 -m unittest discover -s . -p "test_*.py" -v

      - name: Validate PR Review Contract
        working-directory: .github/scripts
        run: python3 review_contract.py
