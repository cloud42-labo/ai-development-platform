name: Review Contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review-contract:
    name: Review Contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run parser regression tests
        working-directory: .github/scripts
        run: python3 test_review_contract.py -v

      - name: Validate PR Review Contract
        working-directory: .github/scripts
        run: python3 review_contract.py
